services:
  - type: web
    name: marketing-flow-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/marketing.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disks:
      - name: marketing-data
        mountPath: /var/data
        sizeGB: 1
